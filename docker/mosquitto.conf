allow_anonymous true
connection_messages false
log_dest stdout
log_timestamp true
log_timestamp_format %H:%M
log_type error
persistence false

listener 1883 0.0.0.0

listener 8883 0.0.0.0
cafile /mosquitto/tls/ca.crt
certfile /mosquitto/tls/broker.crt
keyfile /mosquitto/tls/broker.key

listener 9001 0.0.0.0
protocol websockets
cafile /mosquitto/tls/ca.crt
certfile /mosquitto/tls/broker.crt
keyfile /mosquitto/tls/broker.key
